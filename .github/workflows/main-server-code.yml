name: Update main server code
# Uploads only the code of workers/yahoo (fair-catch-yahoo). Uses Cloudflare's content-only route,
# so the server's bindings (database, email, rate limit), variables and secrets stay exactly as they are.
# Run by hand only. Undo: Cloudflare dashboard > fair-catch-yahoo > Deployments > roll back.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4/accounts/7d9cc22c480bdad5228629d28aabe3ed/workers/scripts/fair-catch-yahoo
    steps:
      - uses: actions/checkout@v4
      - name: Settings before (names and types only, never values)
        run: curl -fsS -H "Authorization: Bearer $T" "$API/settings" | jq -c '.result.bindings | map({name,type})'
      - name: Upload the code only
        run: |
          echo '{"main_module":"worker.js"}' > meta.json
          curl -fsS -X PUT -H "Authorization: Bearer $T" "$API/content" \
            -F "metadata=@meta.json;type=application/json" \
            -F "worker.js=@workers/yahoo/worker.js;type=application/javascript+module" | jq -c '{success, errors}'
      - name: Settings after (should match the line above)
        run: curl -fsS -H "Authorization: Bearer $T" "$API/settings" | jq -c '.result.bindings | map({name,type})'
